services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voxora
      POSTGRES_USER: voxora
      POSTGRES_PASSWORD: voxora
    ports:
      - "5432:5432"
    volumes:
      - voxora_pg:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxora -d voxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://voxora:voxora@db:5432/voxora
      SESSION_SECRET: local-development-secret-change-me-please-12345
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  voxora_pg:
